<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Task | Hangarin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'task_list' %}">⬅ Cancel & Go Back</a>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm border-0 p-4">
                    <h3 class="fw-bold mb-4">
                        {% if task %}Edit Task: {{ task.title }}{% else %}Create New Task{% endif %}
                    </h3>
                    <form method="POST">
                        {% csrf_token %}
                        <!-- This securely renders the Django ModelForm with Bootstrap styling -->
                        {{ form.as_p }}
                        
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-success fw-bold py-2">💾 Save Task</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
